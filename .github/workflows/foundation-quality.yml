name: Foundation quality

on:
  pull_request:
  push:
    branches:
      - main
      - "build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate safe public foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run dependency-free foundation checks
        run: python scripts/validate_foundation.py
