name: Publish Rafeeq rc2 tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.9.0-rc2.yml"

permissions:
  contents: write

jobs:
  tag:
    name: Create pinned release tag
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.9.0-rc2 at the validated commit
        shell: bash
        run: |
          set -euo pipefail
          target="985a052363cb21618370d7eeed7db179cf0e9734"
          tag="v0.9.0-rc2"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$target" -m "Rafeeq Mini v0.9.0-rc2"
          git push origin "refs/tags/$tag"
